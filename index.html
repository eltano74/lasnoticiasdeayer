<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Las Noticias de Ayer</title>
<meta name="description" content="Lo más importante de ayer en Argentina, en un solo lugar: política, economía, espectáculos, entretenimiento, deporte y noticias falopas. Título, reseña y enlace a la fuente.">
<meta property="og:title" content="Las Noticias de Ayer">
<meta property="og:description" content="Lo que pasó, en un solo lugar.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2068%22%3E%3Cpath%20fill%3D%22%23fff%22%20stroke%3D%22%2316181D%22%20stroke-width%3D%224%22%20d%3D%22M12%2012H52a6%206%200%200%201%206%206V48L45%2061H12a6%206%200%200%201-6-6V18a6%206%200%200%201%206-6Z%22/%3E%3Cpath%20fill%3D%22%232340B8%22%20d%3D%22M8%2018a4%204%200%200%201%204-4H52a4%204%200%200%201%204%204V28H8Z%22/%3E%3Crect%20fill%3D%22%2316181D%22%20x%3D%2217%22%20y%3D%225%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%223%22/%3E%3Crect%20fill%3D%22%2316181D%22%20x%3D%2241%22%20y%3D%225%22%20width%3D%226%22%20height%3D%2213%22%20rx%3D%223%22/%3E%3Ctext%20x%3D%2230%22%20y%3D%2252%22%20text-anchor%3D%22middle%22%20font-size%3D%2224%22%20font-family%3D%22Arial%22%20font-weight%3D%22800%22%20fill%3D%22%2316181D%22%3E-1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,700;14..32,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: una "edición" por día. Sello de fecha grande arriba, rubros como pestañas, notas en columnas que pasan a una sola en el teléfono. */
:root{
  --paper:#F2F3EF; --surface:#FBFBF8; --ink:#16181D; --muted:#5C6170; --line:#D9DBD3;
  --accent:#2340B8; --accent-ink:#FFFFFF;
  --c-politica:#B4372B; --c-economia:#1E7A55; --c-espectaculos:#A23B86; --c-entretenimiento:#C27012; --c-deporte:#2463A8; --c-falopas:#6A3FD0; --falopa-bg:#ECE6FB;
  --danger:#B4372B;
  --f-display:"Inter Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Newsreader", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121419; --surface:#1A1D24; --ink:#ECEDEA; --muted:#9BA0AC; --line:#2C303A;
  --accent:#8EA2FF; --accent-ink:#0E1220;
  --c-politica:#F08A7E; --c-economia:#6FCFA4; --c-espectaculos:#E58BCB; --c-entretenimiento:#F2B162; --c-deporte:#7FB4F0; --c-falopas:#B8A2FF; --falopa-bg:#211B33;
  --danger:#F08A7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121419; --surface:#1A1D24; --ink:#ECEDEA; --muted:#9BA0AC; --line:#2C303A;
  --accent:#8EA2FF; --accent-ink:#0E1220;
  --c-politica:#F08A7E; --c-economia:#6FCFA4; --c-espectaculos:#E58BCB; --c-entretenimiento:#F2B162; --c-deporte:#7FB4F0; --c-falopas:#B8A2FF; --falopa-bg:#211B33;
  --danger:#F08A7E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,h4,.tab,.btn{font-optical-sizing:auto}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 56px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:3px solid var(--ink)}
.brand{display:flex;align-items:center;gap:clamp(12px,2.4vw,20px);min-width:0}
.brand>div{min-width:0}
.mark{width:clamp(64px,11vw,96px);height:auto;flex:none;transform:rotate(-4deg)}
.mark .sheet{fill:var(--surface);stroke:var(--ink)}
.mark .band{fill:var(--accent)}
.mark .ring{fill:var(--ink)}
.mark .fold{fill:var(--line);stroke:var(--ink)}
.mark .num{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.mark .lbl{font-family:var(--f-mono);font-weight:700;fill:var(--accent-ink);letter-spacing:.14em}
.ico{width:16px;height:16px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7.2vw,72px);line-height:.9;letter-spacing:-.03em;margin:0;text-wrap:balance}
.brand h1 span{color:var(--accent);display:block}
.slogan{font-family:var(--f-body);font-style:italic;color:var(--muted);margin:8px 0 0;font-size:18px}
.slogan-edit{width:min(100%,420px);margin-top:8px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.stamp{font-family:var(--f-mono);text-align:right;min-width:0}
.stamp .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stamp .d{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;margin-top:2px}
.social{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px;align-items:center}
.social .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.social a,.social .off{display:inline-flex;gap:5px;align-items:center;font-family:var(--f-display);font-weight:500;font-size:13px;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px}
.social a:hover{border-color:var(--accent);color:var(--accent)}
.social .off{font-weight:500;font-size:13px;border:1px dashed var(--line);border-radius:999px;padding:3px 11px;color:var(--muted)}
.social .ico{width:13px;height:13px}
.redes-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.redes-edit label{display:grid;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:0}
.redes-edit input{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);font-family:var(--f-mono);font-size:14px;min-width:0;width:100%}
.redes-edit .hint{grid-column:1/-1;margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stamp .n{font-size:12px;color:var(--muted);margin-top:4px}

/* Barra de control */
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-family:var(--f-display);font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tab .ico{color:var(--dc)}
.tab[aria-pressed="true"] .ico{color:inherit}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.datenav{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;font-family:var(--f-mono);font-size:14px}
.iconbtn:disabled{opacity:.35;cursor:default}
.datenav input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-family:var(--f-mono);font-size:14px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 14px;font-family:var(--f-display);font-weight:500;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--paper)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* Notas */
.status{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-block:10px}
.lead{display:grid;grid-template-columns:1fr;gap:6px;padding-block:22px;border-bottom:1px solid var(--line)}
.lead h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.4vw,40px);line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance;max-width:24ch}
.lead p{font-size:19px;max-width:62ch;margin:4px 0 0}
section.rubro{padding-block:22px;border-bottom:1px solid var(--line)}
section.rubro>h3{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--rc)}
section.rubro>h3 .ico{width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 28px}
.nota{min-width:0;display:flex;flex-direction:column;gap:6px}
.nota .tag{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.nota h4{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.18;margin:0;text-wrap:balance}
.nota h4 a,.lead h2 a{text-decoration:none}
.nota h4 a:hover,.lead h2 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.nota p{margin:0;color:var(--ink);opacity:.88}
.src{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.src a{color:var(--accent);text-decoration:none}
.src a:hover{text-decoration:underline}
.nota.oculta,.lead.oculta{opacity:.42}
.flag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.edit-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 9px;font-family:var(--f-mono);font-size:12px;cursor:pointer}
.mini.warn{color:var(--danger);border-color:var(--danger)}
.bajada{margin:-6px 0 16px;font-style:italic;color:var(--muted)}
section.rubro.falopa{background:var(--falopa-bg);border:2px dashed var(--c-falopas);border-radius:10px;padding:20px 18px;margin-block:22px}
section.rubro.falopa>h3{font-size:22px;letter-spacing:.02em;text-transform:none;transform:rotate(-1.2deg);transform-origin:left}
section.rubro.falopa>h3 .ico{width:26px;height:26px}
.empty{padding-block:48px;text-align:center;color:var(--muted);font-size:18px}
.empty b{display:block;font-family:var(--f-display);color:var(--ink);font-size:22px;margin-bottom:6px}

/* Archivo */
.archive{padding-block:20px;display:grid;gap:22px}
.archive h3{font-family:var(--f-display);font-size:28px;margin:0}
.mes h4{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 8px;text-transform:capitalize}
.dias{display:flex;flex-wrap:wrap;gap:6px}
.dia{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.dia small{color:var(--muted)}

/* Formulario */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,16,.45)}
.form{display:grid;gap:12px;padding:20px}
.form h3{font-family:var(--f-display);margin:0;font-size:22px}
.form label{display:grid;gap:4px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper);font-family:var(--f-body);font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
.form textarea{min-height:90px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.form .err{color:var(--danger);font-family:var(--f-mono);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:13px;padding:8px 14px;border-radius:6px}
.foot{padding-top:22px;font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.6}
@media (max-width:520px){.stamp{text-align:left}.social{justify-content:flex-start}.form .two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
.dia{color:var(--ink)}
.foot p{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 68" role="img" aria-label="Hoja de calendario arrancada: menos un día">
        <path class="sheet" stroke-width="3" d="M12 12H52a6 6 0 0 1 6 6V48L45 61H12a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6Z"/>
        <path class="band" d="M7.5 18a4.5 4.5 0 0 1 4.5-4.5H52a4.5 4.5 0 0 1 4.5 4.5V27H7.5Z"/>
        <text class="lbl" x="32" y="23.4" text-anchor="middle" font-size="8">AYER</text>
        <rect class="ring" x="17" y="5" width="5" height="13" rx="2.5"/>
        <rect class="ring" x="42" y="5" width="5" height="13" rx="2.5"/>
        <text class="num" x="30" y="51" text-anchor="middle" font-size="24">−1</text>
        <path class="fold" stroke-width="3" stroke-linejoin="round" d="M58 48H49a4 4 0 0 0-4 4V61Z"/>
      </svg>
      <div>
      <h1>Las Noticias <span>de Ayer</span></h1>
      <p class="slogan" id="slogan">Lo que pasó, en un solo lugar.</p>
      </div>
    </div>
    <div class="stamp">
      <div class="k">Edición del</div>
      <div class="d" id="stampDate">—</div>
      <div class="n" id="stampCount"></div>
      <nav class="social" id="social" aria-label="Redes sociales"></nav>
    </div>
  </header>

  <div class="bar">
    <nav class="tabs" id="tabs" aria-label="Rubros"></nav>
    <div class="datenav">
      <button class="iconbtn" id="prevDay" aria-label="Día anterior con noticias">‹</button>
      <input type="date" id="dayPick" aria-label="Elegir fecha">
      <button class="iconbtn" id="nextDay" aria-label="Día siguiente con noticias">›</button>
      <button class="iconbtn" id="openArchive">Archivo</button>
    </div>
  </div>

  <main id="main"><p class="status" id="loading">Cargando la edición…</p></main>

  <footer class="foot">
    <p>Cada nota muestra un título, una reseña propia y el enlace a la fuente original. Para leer la nota completa, entrá al medio que la publicó.</p>
    <p>Las Noticias de Ayer · marca en trámite</p>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
